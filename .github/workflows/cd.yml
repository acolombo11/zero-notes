name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  package_json: "app/package.json"

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.release_info.outputs.release_version }}
      version: ${{ steps.version.outputs.value }}
      packageManager: ${{ steps.packageManager.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        uses: sergeysova/jq-action@v2
        id: version
        with:
          cmd: "jq .version ${{ env.package_json }} -r"

      - name: Extract packageManager from package.json
        uses: sergeysova/jq-action@v2
        id: packageManager
        with:
          cmd: "jq .packageManager ${{ env.package_json }} -r"

      - name: Gather Release Information
        id: release_info
        run: echo "release_version=$(cat app/package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"version\"])')" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: macos-latest
    name: Build mac-arm64.dmg
    needs: create_release

    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node pnpm
        run: npm install -g ${{ needs.create_release.outputs.packageManager }}
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Remove Build Directory
        uses: JesseTG/rm@v1.0.2
        with:
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build

      - name: Remove Kernel Directories
        run: |
          rm -rf ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel-linux
          rm -rf ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel
          rm -rf ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel-darwin

      - name: Building Kernel (arm64)
        run: go build -tags fts5 -o "../app/kernel-darwin-arm64/SiYuan-Kernel" -v -ldflags "-s -w -X github.com/${{ github.repository }}/kernel/util.Mode=prod"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: darwin
          GOPATH: ${{ github.workspace }}/go
          GOARCH: arm64

      - name: Building Electron App (arm64)
        run: pnpm run dist-darwin-arm64
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_name: zero-notes-${{ needs.create_release.outputs.version }}-mac-arm64.dmg
          asset_path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build/siyuan-${{ needs.create_release.outputs.version }}-mac-arm64.dmg
          asset_content_type: application/octet-stream

  docker:
    runs-on: ubuntu-latest
    name: Build and push Docker image
    needs: create_release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.create_release.outputs.version }}
