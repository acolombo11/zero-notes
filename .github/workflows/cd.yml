name: CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  package_json: "app/package.json"

jobs:
  build:
    name: Build mac-arm64.dmg
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Extract version and packageManager from package.json
        id: meta
        run: |
          echo "version=$(jq -r .version ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/${{ env.package_json }})" >> $GITHUB_OUTPUT
          echo "packageManager=$(jq -r .packageManager ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/${{ env.package_json }})" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node pnpm
        run: npm install -g ${{ steps.meta.outputs.packageManager }}
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Remove Build Directory
        uses: JesseTG/rm@v1.0.2
        with:
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build

      - name: Remove Kernel Directories
        run: |
          rm -rf ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel-linux
          rm -rf ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel
          rm -rf ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel-darwin

      - name: Building Kernel (arm64)
        run: go build -tags fts5 -o "../app/kernel-darwin-arm64/SiYuan-Kernel" -v -ldflags "-s -w -X github.com/${{ github.repository }}/kernel/util.Mode=prod"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: darwin
          GOPATH: ${{ github.workspace }}/go
          GOARCH: arm64

      - name: Building Electron App (arm64)
        run: pnpm run dist-darwin-arm64
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Create or update rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build (${{ steps.meta.outputs.version }})
          body: "Rolling release — built from the latest commit on `master`."
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build/siyuan-${{ steps.meta.outputs.version }}-mac-arm64.dmg
          artifactName: zero-notes-${{ steps.meta.outputs.version }}-mac-arm64.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
